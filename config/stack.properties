# The lab stack of compose.yaml, for the stack tests and the drills (scripts/stack.sh test,
# scripts/drill.sh). Every key is required.
kafka.bootstrap=127.0.0.1:22800
booking.db.url=jdbc:postgresql://127.0.0.1:22801/seatwave
inventory.db.url=jdbc:postgresql://127.0.0.1:22802/seatwave
payment.db.url=jdbc:postgresql://127.0.0.1:22803/seatwave
db.user=seatwave
# Relative to the project folder; scripts/stack.sh up writes it, down deletes it.
db.passwordFile=.secrets/postgres.password
# Connections per service process; the drills' writers use up to 16 at once.
db.poolSize=16
# The three services run on the host (scripts/drill.sh starts them) and the stub in Compose.
booking.url=http://127.0.0.1:22810
inventory.url=http://127.0.0.1:22811
payment.url=http://127.0.0.1:22812
provider.url=http://127.0.0.1:22820
# Connect and request timeout of every call to the stack, except the two below.
stack.timeoutMillis=10000
# The saga's payment step (Section 13: 5 s), and the payment service's call to the provider, shorter
# so that the service answers "unavailable" before the orchestrator gives up on it.
payment.stepTimeoutMillis=5000
provider.timeoutMillis=3000
# Module 2's hold, and Module 2's average ticket for every seat of the lab.
hold.seconds=300
seat.price=80.00
# The relay (Section 6b): a pass every 100 ms when idle, up to 1,000 rows a pass.
relay.pollMillis=100
relay.batchSize=1000
# The saga's retry wait: 1 s, doubling, capped at 60 s.
saga.firstRetryMillis=1000
saga.maxRetryMillis=60000
